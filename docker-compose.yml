version: '3.8'
services:
  backend:
    build:
      context: ./meeting_assistant
      dockerfile: backend/Dockerfile
    container_name: meeting-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/meetings
      - REDIS_URL=redis://redis:6379/0
      - LLAMA_MODEL_PATH=/models/llama-2-7b-chat.gguf  # if using local LLM
      - OPENAI_API_KEY=     # if using OpenAI
    depends_on:
      - postgres
      - redis


  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_user -d meetings"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7
    container_name: meeting-redis
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./meeting_assistant
      dockerfile: frontend/Dockerfile
    container_name: meeting-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
